[package]
name = "markdown-editor"
version = "0.1.0"
description = "A small, TextEdit-style Markdown reader and writer"
authors = ["bedoya"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Smaller release builds (recommended by Tauri's docs). These only affect
# `npm run desktop:build`; dev builds stay fast to compile.
[profile.release]
codegen-units = 1   # optimise the program as a whole (slower build, smaller app)
lto = true          # link-time optimisation: drop unused code across crates
opt-level = "s"     # optimise for size rather than raw speed (plenty fast for an editor)
panic = "abort"     # no unwinding machinery in the binary
strip = true        # remove debug symbols
